<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/paynet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="canteiner">
            <div class="logo">
                  <a href="../index.html"> <img src="../assets/svg/Frame.svg" alt=""></a>
            </div>
            <div class="project">
                <p><a href="./all-prodoct.html">ALL PRODUCTS</a></p>
                <p><a href="./about-seedra.html">ABOUT SEEDRA</a></p>
                <p><a href="./our-blog.html">OUR BLOG</a></p>
                <p><a href="../pages/contact.html">CONTACTS</a></p>
            </div>
            <div class="ilova">
                <a href="./Information.html"> <img src="../assets/imgs/ant-design_instagram-filled.png" alt=""></a>
                <img src="../assets/imgs/akar-icons_facebook-fill.png" alt="">
            </div>
            <button>
                <img src="../assets/imgs/icon_search.png" alt="">
                <input type="text" placeholder="Search">
            </button>
            <div class="ilova1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" fill="currentColor">
                    <path
                        d="M12.001 4.52853C14.35 2.42 17.98 2.49 20.2426 4.75736C22.5053 7.02472 22.583 10.637 20.4786 12.993L11.9999 21.485L3.52138 12.993C1.41705 10.637 1.49571 7.01901 3.75736 4.75736C6.02157 2.49315 9.64519 2.41687 12.001 4.52853ZM18.827 6.1701C17.3279 4.66794 14.9076 4.60701 13.337 6.01687L12.0019 7.21524L10.6661 6.01781C9.09098 4.60597 6.67506 4.66808 5.17157 6.17157C3.68183 7.66131 3.60704 10.0473 4.97993 11.6232L11.9999 18.6543L19.0201 11.6232C20.3935 10.0467 20.319 7.66525 18.827 6.1701Z">
                    </path>
                </svg>
               <a href="./yourcard.html"> <img src="../assets/svg/icon_cart_simple.svg" alt=""></a>
            </div>
        </div>
    </nav>

    <main class="payment-page canteiner">
        <div class="payment-box">

            <div class="payment-top">
                <div class="payment-title">
                    <a href="checkout.html" class="back-arrow"><i class="fas fa-arrow-left"></i></a>
                    <h1>Payment info</h1>
                </div>
                <div class="progress-indicator">
                    <span class="progress-bar"></span>
                    <span class="progress-bar active"></span>
                </div>
            </div>

            <form class="payment-form">
                <label class="section-label">Card type</label>
                <div class="card-type-row">
                    <button type="button" class="card-type-btn">
                        <i class="fab fa-apple-pay"></i>
                    </button>
                    <button type="button" class="card-type-btn">
                        <i class="fab fa-cc-visa visa-icon"></i>
                    </button>
                    <button type="button" class="card-type-btn active">
                        <i class="fab fa-cc-mastercard mc-icon"></i>
                    </button>
                    <button type="button" class="card-type-btn">
                        <i class="fab fa-cc-paypal paypal-icon"></i>
                    </button>
                </div>

                <div class="form-field">
                    <label>Card number</label>
                    <input type="text" placeholder="0000 0000 0000 0000">
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label>Expiring date</label>
                        <input type="text" placeholder="01/01">
                    </div>
                    <div class="form-field">
                        <label>CCV</label>
                        <input type="text" placeholder="123">
                    </div>
                </div>

                <div class="payment-divider"></div>

                <div class="total-row">
                    <span>Total amount</span>
                    <span class="total-value">$12.56</span>
                </div>

                <button type="submit" class="continue-btn">
                    <span class="price-part">$12.56</span>
                    <span class="continue-part">Continue <i class="fas fa-arrow-right"></i></span>
                </button>
            </form>

        </div>
    </main>

    <footer class="seedra-footer canteiner">
        <div class="pages-text">
            <p class="p1">ALL PRODUCTS</p>
            <div class="line"></div>
            <p>ABOUT SEEDRA</p>
            <div class="line"></div>
            <p>OUR BLOG</p>
            <img src="../assets/svg/Frame.svg" alt="">
            <p>Terms&amp;Conditions</p>
            <div class="line"></div>
            <p>Privacy Policy.</p>
        </div>
        <div class="lene2"></div>
        <div class="ilova-footer container">
            <div>
                <img src="../assets/imgs/ant-design_instagram-filled (1).png" alt="">
                <img src="../assets/imgs/akar-icons_facebook-fill (1).png" alt="">
            </div>
            <p>All rights reserved</p>
        </div>
    </footer>

</body>

</html>
